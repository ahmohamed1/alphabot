<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Controller</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/3.1.3/socket.io.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Mobile-friendly overrides */
        body { overflow: auto; position: static; }
        .jumbotron h1 { font-size: 1.6rem; margin: 0.5rem 0; }
        .joystick-container { display:flex; justify-content:center; margin: 0.5rem 0 0.75rem; }
        .joystick-base { width: 160px; height: 160px; max-width: 32vw; max-height: 32vw; border-radius:50%; background:#f5f5f5; position:relative; touch-action:none; }
        .joystick-stick { width: 64px; height: 64px; max-width: 13vw; max-height: 13vw; border-radius:50%; background:#dcdcdc; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); }
        #mapCanvas { width: 100% !important; height: auto !important; max-height: 85vh; display:block; }
        #cameraFeed { width: 100% !important; height: auto !important; max-height: 85vh; display:none; border:1px solid #333; }
        .view-toggle { display:flex; justify-content:center; gap:8px; margin-top:8px; }
        .output { text-align:center; margin-top:0.4rem; }
        .manual-grid { display:flex; flex-wrap:wrap; align-items:flex-end; gap: 8px; }
        .manual-grid .panel-col { flex: 1 1 240px; }
        .manual-grid .map-col { flex: 2 1 420px; }
        .joystick-col { display:flex; flex-direction:column; justify-content:flex-end; }
        .map-col { display:flex; flex-direction:column; }
        .map-col canvas { flex: 1 1 auto; }
        /* Smaller robot feedback table */
        .state-col .table { font-size: 0.85rem; }
        .state-col .table td, .state-col .table th { padding: 6px 8px; }
        @media (min-width: 768px) {
            .jumbotron h1 { font-size: 2.4rem; }
            .joystick-base { width: 190px; height: 190px; }
            #mapCanvas { max-height: 90vh; }
            #cameraFeed { max-height: 90vh; }
        }
        @media (orientation: landscape) and (max-width: 1024px) {
            .manual-grid { flex-wrap: nowrap; }
            .manual-grid .panel-col { flex: 1 1 25%; }
            .manual-grid .map-col { flex: 2 1 50%; }
        }
    </style>
</head>
    <body>

        <nav class="navbar navbar-default">
            <div class="container-fluid">
                <div class="navbar-header">
                    <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#main-navbar">
                        <span class="sr-only">Toggle navigation</span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                    </button>
                    <a class="navbar-brand" href="#">Robot Controller</a>
                </div>

                <div class="collapse navbar-collapse" id="main-navbar">
                    <ul class="nav navbar-nav">
                        <li class="active"><a href="/" id="nav-robot-state">Robot State</a></li>
                        <li><a href="/navigation" id="nav-navigation">Navigation</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="jumbotron text-center">
                <h1>Robot Controller</h1>
        </div>

    <div class="container">
        <div class="manual-grid" id="manualGrid">

            <!-- LEFT COLUMN: Rotation Joystick -->
            <div id="leftJoystickCol" class="panel-col joystick-col">
                <h4 class="text-center">Rotate</h4>
                <div class="joystick-container">
                    <div class="joystick-base" id="leftJoystickBase">
                        <div class="joystick-stick" id="leftJoystickStick"></div>
                    </div>
                </div>
                <div class="output">
                    Rotate: <span id="rotVal">0</span>
                </div>
            </div>

            <!-- MIDDLE COLUMN: Map -->
            <div id="mapCol" class="panel-col map-col">
                <h3 class="text-center">View</h3>
                <canvas id="mapCanvas" style="border:1px solid #333;" width="300" height="300"></canvas>
                <img id="cameraFeed" src="" alt="Camera Feed" />
                <div class="view-toggle">
                    <button id="btnShowMap" class="btn btn-default btn-sm active">Map</button>
                    <button id="btnShowCamera" class="btn btn-default btn-sm">Camera</button>
                </div>
            </div>

            <!-- RIGHT COLUMN: Speed Joystick -->
            <div id="rightJoystickCol" class="panel-col joystick-col">
                <h4 class="text-center">Speed</h4>
                <div class="joystick-container">
                    <div class="joystick-base" id="rightJoystickBase">
                        <div class="joystick-stick" id="rightJoystickStick"></div>
                    </div>
                </div>
                <div class="output">
                    Speed: <span id="speedVal">0</span>
                </div>
            </div>

        </div>

        <div class="row" id="robotStatePage">
            <!-- Robot State -->
            <div id="stateCol" class="col-xs-12 state-col">
                <h3>Robot State (Feedback)</h3>
                <div class="table-responsive">
                <table class="table table-bordered">
                    <tr><th>Linear Velocity (m/s)</th><td id="linVel">0</td></tr>
                    <tr><th>Angular Velocity (rad/s)</th><td id="angVel">0</td></tr>
                    <tr><th>X (m)</th><td id="posX">0</td></tr>
                    <tr><th>Y (m)</th><td id="posY">0</td></tr>
                    <tr><th>Yaw (rad)</th><td id="yaw">0</td></tr>
                </table>
                </div>
            </div>
        </div>

        
    </div>

    <!-- Custom Scripts -->
    <script src="{{ url_for('static', filename='scripts/joystick.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/state.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/map.js') }}"></script>

    <script>
        // Simple navbar-driven section toggling + location management
        (function(){
            // --- Mapping control ---
            const btnStartMapping = document.getElementById('btnStartMapping');
            let mappingActive = false;
            if (btnStartMapping) {
                btnStartMapping.addEventListener('click', function(){
                    mappingActive = !mappingActive;
                    if(mappingActive){
                        btnStartMapping.textContent = 'Stop Mapping';
                        const s = window.socket || socket;
                        if(s && s.emit) s.emit('start_mapping');
                    } else {
                        btnStartMapping.textContent = 'Start Mapping';
                        const s = window.socket || socket;
                        if(s && s.emit) s.emit('stop_mapping');
                    }
                });
            }

            // --- View toggle (Map / Camera) ---
            const btnShowMap = document.getElementById('btnShowMap');
            const btnShowCamera = document.getElementById('btnShowCamera');
            const mapCanvas = document.getElementById('mapCanvas');
            const cameraFeed = document.getElementById('cameraFeed');

            function setView(view){
                const isMap = view === 'map';
                mapCanvas.style.display = isMap ? 'block' : 'none';
                cameraFeed.style.display = isMap ? 'none' : 'block';
                btnShowMap.classList.toggle('active', isMap);
                btnShowCamera.classList.toggle('active', !isMap);
                if (btnStartMapping) {
                    btnStartMapping.style.display = isMap ? '' : 'none';
                }
            }

            btnShowMap.addEventListener('click', function(e){ e.preventDefault(); setView('map'); });
            btnShowCamera.addEventListener('click', function(e){ e.preventDefault(); setView('camera'); });

            // default
            setView('map');

        })();
    </script>

</body>
</html>
